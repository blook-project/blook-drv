# blook-drv 单文件 UTF-8 配置；完整规则及作用范围见 docs/features.md。
# 管理员执行 blook-loader config-path <path> 只登记 Parameters\ConfigPath；
# blook-loader reload 手动重读，apply [path] 依次登记并重读，不是磁盘/内存原子事务。
# 无后台轮询；文件及可信父目录必须仅允许 Administrators/SYSTEM 写入。
# startup-only 项变更需要重启驱动；reload 会拒绝整份候选配置。

[device]
# 控制交互式用户设备访问权限；默认仅管理员/SYSTEM，可选开启并不绕过管理操作鉴权。
allow_users = false

[hypervisor]
# startup-only：控制时间隐藏，保留历史默认开启。
hide_timing = true

[diagnostics]
# startup-only：页错误跟踪，0 关闭、1 记录并反射、2 仅反射不记录。
page_fault_trace = 0

[features]
# 以下 12 项等于 NT hide 预设（hide::activate / blook-loader hide on）：面向
# [roles] 的 target 进程隐藏调试器痕迹；window.* 是独立 opt-in，此处保持关闭。
# 目标进程首次接触已安装查询入口时清理 PEB/heap/debug flags。
scrub.first_contact = true
# 用户态工具写入非工具进程时临时中和 BeingDebugged 字节。
scrub.write_memory = true
# 对非工具调用者隐藏系统进程列表中的工具进程。
nt.query_system.process = true
# 对非工具调用者隐藏系统模块列表中的匹配模块。
nt.query_system.module = true
# 对非工具调用者返回无内核调试器状态。
nt.query_system.kernel_debugger = true
# 对用户态目标调用者隐藏进程调试信息。
nt.query_process = true
# 阻止目标调用者设置 ThreadHideFromDebugger。
nt.set_thread = true
# 对目标调用者隐藏 ThreadHideFromDebugger。
nt.query_thread = true
# 对目标调用者隐藏上下文硬件断点。
nt.get_context = true
# 拒绝目标调用者打开工具进程。
nt.open_process = true
# 拒绝目标调用者打开工具线程。
nt.open_thread = true
# 成功附加调试器后清理被附加进程，不限角色。
scrub.debug_attach = true
# 对目标调用者隐藏工具窗口所属 PID。
window.query = false
# 对目标调用者隐藏查找到的工具窗口。
window.find = false
# 对目标调用者从窗口枚举移除工具窗口。
window.list = false
# 对目标调用者用上次可见窗口替代工具前台窗口。
window.foreground = false
# 对目标调用者隐藏坐标命中的工具窗口。
window.point = false

[roles]
# 一行一个 ASCII basename，精确匹配且大小写不敏感；无 PID、通配符或分隔列表。
# 这些是示例文件显式规则，不是驱动静态默认；未配置的角色规则为空。
tool = x64dbg.exe
tool = x32dbg.exe
tool = windbg.exe
tool = frida.exe
# 被分析目标：调试器藏起来，游戏自己看不到调试器进程、窗口、硬件断点。
target = forzahorizon6.exe
# 可添加 target = sample.exe 或 watched = watched.exe；不要填写空规则。
