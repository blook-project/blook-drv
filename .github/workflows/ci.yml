name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XMAKE_ROOT: "y"

jobs:
  build:
    name: build + unit tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.8"

      - name: Install WDK from NuGet content
        shell: pwsh
        run: |
          # windows-latest has no WDK preinstalled (only the Windows SDK).
          # The NuGet WDK content package is a plain zip of the official layout.
          $ver = '10.0.26100.6584'
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\wdk | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$ver/microsoft.windows.wdk.x64.$ver.nupkg" -OutFile $env:RUNNER_TEMP\wdk\wdk.nupkg
          tar.exe -xf $env:RUNNER_TEMP\wdk\wdk.nupkg -C $env:RUNNER_TEMP\wdk
          "WDK_ROOT=$env:RUNNER_TEMP\wdk\c" >> $env:GITHUB_ENV
      - name: Fetch blook-kchannel (pinned)
        shell: pwsh
        run: |
          # The driver links the real transport sources: there is no stub
          # fallback in this job, so a missing fetch fails the build instead of
          # testing against a stand-in.
          $root = Join-Path $env:GITHUB_WORKSPACE '..\blook-kchannel'
          git clone --quiet https://github.com/blook-project/blook-kchannel $root
          git -C $root checkout --quiet 40a5337a2d69c79fb049361f616aacc58ae75d4d
          "KCHANNEL_DIR=$root" >> $env:GITHUB_ENV
      - name: Configure
        shell: pwsh
        run: |
          $env:BLOOK_VERSION = (Get-Content version.txt -Raw).Trim()
          xmake f -p windows -a x64 -m releasedbg --wdk="$env:WDK_ROOT" --kchannel_dir="$env:KCHANNEL_DIR" -y
          if ($LASTEXITCODE -ne 0) { throw "xmake configure failed" }
      - name: Build
        shell: pwsh
        run: |
          xmake -y
          if ($LASTEXITCODE -ne 0) { throw "xmake build failed" }

      - name: Host unit tests
        shell: pwsh
        run: |
          # Run the built executables directly instead of `xmake run`: the exit
          # code of the program is then unambiguous, and a crash (no gtest
          # summary) is distinguishable from an assertion failure.
          $failed = @()
          foreach ($target in @("blook-tests", "blook-client-tests", "blook-loader-tests", "blook-protocol-tests", "blook-terminal-tests", "blook-image-page-tests")) {
            $exe = Get-ChildItem -Recurse build -Filter "$target.exe" -File | Select-Object -First 1
            if (-not $exe) { Write-Host "missing $target.exe"; $failed += "$target (missing)"; continue }
            Write-Host "=== $target ($($exe.FullName)) ==="
            $out = & $exe.FullName 2>&1
            $code = $LASTEXITCODE
            $out | ForEach-Object { Write-Host $_ }
            $assertions = @($out | Select-String -Pattern '\[  FAILED  \]')
            Write-Host "exit code: $code, failed assertions: $($assertions.Count)"
            if ($code -ne 0 -or $assertions.Count -ne 0) { $failed += $target }
          }
          if ($failed.Count -ne 0) { throw "unit tests failed: $($failed -join ', ')" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $ver = (Get-Content version.txt -Raw).Trim()
          $stage = "out/blook-drv-$ver"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $sys = Get-ChildItem -Recurse build -Filter blook-drv.sys | Select-Object -First 1
          if (-not $sys) { throw "blook-drv.sys was not built" }
          Copy-Item $sys.FullName $stage
          foreach ($exe in @("blook-loader.exe", "blook-guest-hooks.exe", "blook-antidetect.exe")) {
            $built = Get-ChildItem -Recurse build -Filter $exe -File | Select-Object -First 1
            if ($built) { Copy-Item $built.FullName $stage }
          }
          # Public headers include <policy/*.hpp>; ship those headers at
          # include/policy so the SDK include root is self-contained.
          $policyStage = Join-Path $stage "include\policy"
          New-Item -ItemType Directory -Force $policyStage | Out-Null
          Copy-Item src\policy\*.hpp $policyStage -Force
          Copy-Item include, sdk, docs, scripts, signer -Destination $stage -Recurse
          Copy-Item README.md, LICENSE, CHANGELOG.md, version.txt, xmake.lua, blook.ini -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "out/blook-drv-$ver.zip" -Force
          (Get-FileHash "out/blook-drv-$ver.zip" -Algorithm SHA256).Hash |
            ForEach-Object { "$($_.ToLower())  blook-drv-$ver.zip" } |
            Set-Content "out/blook-drv-$ver.zip.sha256"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: SDK headers compile check
        shell: pwsh
        run: |
          $zip = Get-ChildItem out -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "no package artefact" }
          Expand-Archive $zip.FullName -DestinationPath sdkcheck -Force
          $stage = (Get-ChildItem -Directory sdkcheck | Select-Object -First 1).FullName
          $include = Join-Path $stage "include"
          $probe = Join-Path $env:RUNNER_TEMP "sdk_probe.cc"
          $lines = @(
            "#include <blook/drv/ept.hpp>",
            "#include <blook/drv/handle.hpp>",
            "#include <blook/drv/transport.hpp>",
            "#include <blook/drv/wire.hpp>",
            "int main() { return wire::abi_version == 7 ? 0 : 1; }"
          )
          Set-Content $probe ($lines -join "`n")
          & cl.exe /nologo /std:c++20 /EHsc /W4 /WX /I $include /c $probe /Fo:$env:RUNNER_TEMP\sdk_probe.obj
          if ($LASTEXITCODE -ne 0) { throw "packaged SDK headers are not self-contained" }
          Write-Host "packaged SDK headers compile against include/ alone"

      - uses: actions/upload-artifact@v4
        with:
          name: blook-drv-ci
          path: out/*
          if-no-files-found: error


  format:
    name: clang-format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang-format
        shell: pwsh
        run: |
          python -m pip install --quiet "clang-format==20.1.0"
          clang-format --version
      - name: Check formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.cc,*.cpp,*.h,*.hpp |
            Where-Object { $_.FullName -notmatch '\\third_party\\|\\build\\|\\signer\\|\\.xmake\\' }
          $bad = @()
          foreach ($f in $files) {
            $diff = & clang-format --style=file --dry-run --Werror $f.FullName 2>&1
            if ($LASTEXITCODE -ne 0) { $bad += $f.FullName; Write-Host $diff }
          }
          if ($bad.Count -ne 0) { throw "clang-format violations in: $($bad -join ', ')" }

  e2e-matrix:
    name: e2e matrix (non-VT-x, hosted runner)
    # Runs on a disposable GitHub runner (a VM, never the physical lab host) and
    # loads the signed driver with the hypervisor disabled, so the job exercises
    # signature acceptance, DriverEntry, the service lifecycle and DriverUnload
    # without VT-x and without ever entering guest mode. The hypervisor matrix
    # stays in the VM-only e2e harness (scripts/E2E.ps1).
    runs-on: windows-latest
    needs: build
    # Required: the full non-VT-x e2e matrix is part of the release gate.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blook-drv-ci
          path: out

      - name: Unpack package
        shell: pwsh
        run: |
          $zip = Get-ChildItem out -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "no package artefact" }
          Expand-Archive $zip.FullName -DestinationPath stage -Force
          Get-ChildItem stage | Select-Object Name

      - name: Import signing certificate
        shell: pwsh
        env:
          SPC_PFX_BASE64: ${{ secrets.SPC_PFX_BASE64 }}
          SPC_PFX_PASSWORD: ${{ secrets.SPC_PFX_PASSWORD }}
        run: |
          if (-not $env:SPC_PFX_BASE64) {
            Write-Host "SPC_PFX_BASE64 is not configured - kernel load smoke skipped"
            "SKIP=1" >> $env:GITHUB_ENV
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'spc.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SPC_PFX_BASE64))
          $pw = ConvertTo-SecureString $env:SPC_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
          # Trust imports (verified recipe): the SPC timestamp chain needs its
          # root and intermediates in the machine stores before the kernel can
          # accept the signature, and the leaf must be a trusted publisher.
          $tsa = Get-ChildItem -Recurse stage -Filter tsa-root.cer | Select-Object -First 1
          if ($tsa) { certutil -addstore -f root $tsa.FullName } 
          $certDir = Join-Path $PWD 'signer\certs'
          if (-not (Test-Path $certDir)) { $certDir = (Get-ChildItem -Directory stage | Select-Object -First 1).FullName + '\signer\certs' }
          Get-ChildItem $certDir -Filter 'verisign-*.cer' -ErrorAction SilentlyContinue |
            ForEach-Object { certutil -addstore -f CA $_.FullName }
          $leaf = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -match 'XINDA' } | Select-Object -First 1
          if ($leaf) {
            $leafFile = Join-Path $env:RUNNER_TEMP 'spc-leaf.cer'
            [IO.File]::WriteAllBytes($leafFile, $leaf.Export('Cert'))
            certutil -addstore -f trustedpublisher $leafFile
          }

      - name: Sign driver
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          # The package contains signer/, but resolve the tool through both the
          # stage and the checkout so a packaging change cannot break signing.
          $stage = (Get-ChildItem -Directory stage | Select-Object -First 1).FullName
          $sys = Join-Path $stage 'blook-drv.sys'
          if (-not (Test-Path $sys)) { throw "blook-drv.sys missing from the package" }
          $signer = Join-Path $stage 'signer\spcsign\spcsign.exe'
          if (-not (Test-Path $signer)) { $signer = Join-Path $PWD 'signer\spcsign\spcsign.exe' }
          if (-not (Test-Path $signer)) { throw "spcsign.exe not found" }
          $certs = Join-Path $stage 'signer\certs'
          if (-not (Test-Path $certs)) { $certs = Join-Path $PWD 'signer\certs' }
          & $signer sign --sha1 --cert XINDA --tsa-time 2013-01-01T00:00:00Z `
            --chain (Join-Path $certs 'verisign-cscs-2010.cer') `
            --chain (Join-Path $certs 'verisign-g5-mcvr.cer') $sys
          if ($LASTEXITCODE -ne 0) { throw "spcsign failed" }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if ($signtool) {
            & $signtool.FullName verify /kp /v $sys
            if ($LASTEXITCODE -ne 0) { throw "signtool verify /kp failed" }
            Write-Host "signtool verify /kp passed"
          } else {
            Write-Host "signtool not found - skipping kernel-policy verification"
          }

      - name: Non-VT-x e2e matrix
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          $stage = (Get-ChildItem -Directory stage | Select-Object -First 1).FullName
          # $args is a PowerShell automatic variable: use a normal name.
          $e2eArgs = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts\E2E-Host.ps1',
            '-Sys', (Join-Path $stage 'blook-drv.sys'),
            '-Loader', (Join-Path $stage 'blook-loader.exe'),
            '-Hooks', (Join-Path $stage 'blook-guest-hooks.exe'),
            '-Artifacts', 'out/host-e2e'
          )
          & pwsh @e2eArgs
          if ($LASTEXITCODE -ne 0) { throw "non-VT-x e2e reported failures" }
          $result = Get-Content 'out/host-e2e/result.json' -Raw | ConvertFrom-Json
          Write-Host ("host e2e: {0} pass, {1} fail, {2} documented skips" -f $result.summary.pass, $result.summary.fail, $result.summary.skip)
          if ($result.summary.fail -ne 0) { throw "host e2e failures: $(($result.cases | Where-Object status -eq 'fail' | ForEach-Object name) -join ', ')" }

      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1' && always()
        with:
          name: host-e2e-result
          path: out/host-e2e
          if-no-files-found: warn